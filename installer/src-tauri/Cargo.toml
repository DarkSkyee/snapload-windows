[package]
name = "snapload-setup"
version = "1.0.0"
description = "SnapLoad Windows Graphical Installer & Desktop Manager"
authors = ["DarkSkyee"]
edition = "2021"
license = "MIT-NC"

[lib]
name = "snapload_setup_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["custom-protocol"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "time"] }
winreg = "0.52"
sha2 = "0.10"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = false
codegen-units = 1
panic = "abort"
strip = true

[patch.crates-io]
webview2-com-sys = { path = "../crates/webview2-com-sys" }
