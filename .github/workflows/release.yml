name: SnapLoad Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and publish'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release Artifacts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build SnapLoad Desktop Engine
        run: |
          cd engine
          cargo build --release

      - name: Build & Package Browser Extensions
        run: |
          cd extension
          npm ci || npm install
          npm run build
          Compress-Archive -Path dist/chrome/* -DestinationPath dist/snapload-extension-chromium.zip
          Compress-Archive -Path dist/firefox/* -DestinationPath dist/snapload-extension-firefox.zip

      - name: Build Installer (Tauri & Rust)
        run: |
          cd installer
          npm ci || npm install
          npm run build
          cd src-tauri
          cargo build --release

      - name: Publish GitHub Release (Setup Only)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag || 'v1.0.0' }}
          name: "SnapLoad Windows 1.0"
          files: |
            installer/src-tauri/target/release/snapload-setup.exe
          draft: false
          prerelease: false
          generate_release_notes: true
