<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnapLoad</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="snapload-popup">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <svg class="logo" viewBox="0 0 108 108" width="28" height="28" fill="none">
          <defs>
            <linearGradient id="popLogoGrad" x1="0" y1="0" x2="108" y2="108" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#00F2FE"/>
              <stop offset="50%" stop-color="#6366F1"/>
              <stop offset="100%" stop-color="#A855F7"/>
            </linearGradient>
          </defs>
          <path d="M66,32 C58,28 44,29 38,36 C34,41 35,49 42,53 L58,60 C64,63 66,67 64,72 C61,77 53,79 46,77 C41,75 37,71 36,67"
                stroke="url(#popLogoGrad)" stroke-width="8" stroke-linecap="round" fill="none"/>
          <path d="M54,40 L54,66 M44,56 L54,66 L64,56" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="brand-name">SnapLoad</span>
      </div>
      <div id="engine-status" class="status-badge disconnected">
        <span class="status-dot"></span>
        <span id="status-label">Engine Offline</span>
      </div>
    </header>

    <!-- Update Banner (hidden by default) -->
    <div id="update-banner" class="update-banner hidden">
      <div class="update-banner-content">
        <div class="update-icon-wrapper">
          <svg class="update-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </div>
        <div class="update-info">
          <span class="update-title">Update Available</span>
          <span id="update-version-label" class="update-desc">New version is ready</span>
        </div>
      </div>
      <a id="update-action-btn" class="update-action-btn" href="https://github.com/DarkSkyee/SnapLoad-Windows/releases" target="_blank" rel="noreferrer">
        Update
      </a>
    </div>

    <!-- URL Section -->
    <section class="url-card">
      <label for="url-input" class="section-label">Target Media URL</label>
      <div class="url-input-wrapper">
        <input type="text" id="url-input" placeholder="Paste link or open video..." spellcheck="false" />
        <button id="paste-btn" class="icon-btn" title="Paste from clipboard">
          📋
        </button>
      </div>
    </section>

    <!-- Format & Quality Options -->
    <section class="options-card">
      <div class="type-toggle">
        <button id="type-video" class="toggle-btn active">Video</button>
        <button id="type-audio" class="toggle-btn">Audio</button>
      </div>

      <div class="selectors-row">
        <div class="selector-group">
          <label for="format-select">Format</label>
          <select id="format-select">
            <option value="mp4">MP4</option>
            <option value="mkv">MKV</option>
            <option value="webm">WebM</option>
          </select>
        </div>

        <div class="selector-group">
          <label for="quality-select">Quality</label>
          <select id="quality-select">
            <option value="best">Best (Original / 4K)</option>
            <option value="p1080">1080p FHD</option>
            <option value="p720">720p HD</option>
            <option value="p480">480p SD</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Action Button -->
    <button id="download-btn" class="primary-btn">
      <span class="btn-icon">⬇</span>
      <span id="btn-text">Download with SnapLoad</span>
    </button>

    <!-- Active Downloads Section -->
    <section id="downloads-container" class="downloads-card hidden">
      <div class="downloads-header">
        <span>Active Downloads</span>
      </div>
      <div id="downloads-list"></div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <a href="https://github.com/DarkSkyee/SnapLoad-Windows" target="_blank" rel="noreferrer" class="footer-link">
        GitHub • Help & Docs
      </a>
      <div class="version-wrapper">
        <span class="version-tag" id="app-version">v1.0.0</span>
        <button id="check-update-btn" class="check-update-btn" title="Check for updates" aria-label="Check for updates">
          <svg class="check-update-icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 4v6h-6"></path>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
        </button>
      </div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
