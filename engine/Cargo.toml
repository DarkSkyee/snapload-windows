[package]
name = "snapload-engine"
version = "1.0.0"
edition = "2021"
authors = ["DarkSkyee"]
description = "High-performance Native Messaging Host & Media Downloader Engine for SnapLoad Windows"
license = "MIT-NC"

[dependencies]
tokio = { version = "1.38", features = ["rt-multi-thread", "io-util", "io-std", "process", "sync", "macros", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"

[profile.release]
opt-level = 3
codegen-units = 1
strip = true
